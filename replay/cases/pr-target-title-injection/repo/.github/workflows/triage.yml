name: Triage

on:
  pull_request_target:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: echo "REPLAY-MARKER build of the pull request head"
      - run: echo "Triage ${{ github.event.issue.title }}"
